    text{fill:#232719}
    @media (prefers-color-scheme: dark){ text{fill:#fcfef5} }
  </style>
  <g text-anchor="middle" font-family="Georgia,'Times New Roman',serif">
    <text x="100" y="150" font-size="142" letter-spacing="-3">M</text>
    <text x="100" y="150" font-size="168">T</text>
  </g>
</svg>
